# 6-2 실습 환경: 월드모델 — JupyterLab 하나(데이터는 노트북이 직접 만든 합성 데이터라 내려받는 것이 없음)
#
#   전제 : 도커 + (선택) NVIDIA GPU. GPU 가 없어도 모든 노트북이 CPU 로 돈다(느림 : 노트북당 수 분~십여 분)
#     GPU 확인 : docker run --rm --gpus all ubuntu:24.04 nvidia-smi -L
#   전제 : 4-1 의 Jupyter 이미지(ai4-lab/jupyter)를 한 번 빌드했다 → cd ../4-1 && docker compose build
#
#   cd ./-ai-/6-2
#   docker compose up -d --build
#     첫 기동 : 이미지 빌드 약 5~10분(PyTorch CUDA 판을 받음, 인터넷 필요)
#
#   실습 화면 : Jupyter  http://localhost:8893  → 6-2/notebooks
#
#   GPU 를 두 장 가진 PC : WM_GPU 에 쓸 번호(nvidia-smi -L 순서)를 준다 — 예) WM_GPU=1 docker compose up -d
#   GPU 없이 쓰려면 아래 deploy 블록을 지우고 올린다(CUDA_VISIBLE_DEVICES 는 비어 있어도 됨)
#
# 포트는 127.0.0.1 에만 연다(로그인 없는 Jupyter 를 다른 기기가 열지 못하게)
name: ai4-lab

services:
  wm:
    build: ./lab
    image: ai4-lab/jupyter-wm
    container_name: ai4-wm
    ports:
      - "127.0.0.1:${WM_PORT:-8893}:8888"
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - CUDA_VISIBLE_DEVICES=${WM_GPU:-0}      # 도커 데스크톱은 device_ids 로 GPU 를 나누지 못함 → 프로세스가 볼 GPU 를 직접 지정
    volumes:
      - ..:/work                               # 저장소 루트
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${WM_GPU:-0}"]
              capabilities: [gpu]
