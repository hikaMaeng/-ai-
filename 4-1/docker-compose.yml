# 4강 실습 환경: pgvector + 한국어 형태소 분석기 + JupyterLab + pgAdmin
#
#   docker compose up -d --build        # DB · Jupyter · pgAdmin 기동 (첫 빌드는 3~5분)
#   docker compose down -v              # 전부 삭제(데이터 포함)하고 처음부터 다시
#
#   실습 화면: Jupyter  http://localhost:8888  → 4-1/notebooks · 4-2/notebooks
#     데이터 적재 · 임베딩 서버 호출 · 검색 실험은 전부 노트북(클라이언트)에서 한다
#   보조 화면: pgAdmin  http://localhost:5050  → DB 내용을 눈으로 확인
#
# 포트는 전부 127.0.0.1 에만 연다. 로그인 없는 pgAdmin·Jupyter 를 같은 Wi-Fi 의 다른 기기가 열지 못하게.
#
# 임베딩은 호스트(내 PC)에서 도는 LM Studio 서버가 계산한다.
#   컨테이너 안의 localhost 는 컨테이너 자신이므로 host.docker.internal 로 호스트에 닿는다.
#   LM Studio 포트가 1234 가 아니면: LMSTUDIO_URL=http://host.docker.internal:<포트>/v1
#
name: ai4-lab

services:
  db:
    build: ./db
    image: ai4-lab/pgvector-ko:pg17
    container_name: ai4-db
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    # 벡터 인덱스 빌드 실습(4-2)용 설정
    #   maintenance_work_mem : HNSW 그래프를 메모리 안에서 만들 크기 (부족하면 빌드가 매우 느려진다)
    #   max_parallel_maintenance_workers : HNSW·IVFFlat 병렬 빌드
    #   jit=off : 짧은 질의의 지연시간 측정에 잡음이 끼지 않게
    command: >
      postgres
      -c shared_buffers=512MB
      -c maintenance_work_mem=1GB
      -c max_parallel_maintenance_workers=4
      -c jit=off
    shm_size: 1g            # 병렬 빌드는 /dev/shm 을 쓴다. 도커 기본값 64MB 로는 실패한다
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 최초 1회: 익스텐션·스키마 생성
      - ./sql:/sql:ro                              # 실습 SQL (psql -f /sql/... 로 실행)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: ai4-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: lab@example.com
      PGADMIN_DEFAULT_PASSWORD: lab
      # 로그인 화면 없이 바로 쓰는 데스크톱 모드
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    # libpq 는 권한이 0600 이 아닌 pgpass 를 무시한다.
    # Windows 에서 마운트한 파일은 0777 로 보이므로 복사 후 chmod 해서 쓴다.
    entrypoint: >
      /bin/sh -c "cp /pgadmin4/pgpass.src /var/lib/pgadmin/pgpass
      && chmod 600 /var/lib/pgadmin/pgpass
      && exec /entrypoint.sh"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass.src:ro
      - ./sql:/var/lib/pgadmin/storage/pgadmin4_pgadmin.org/sql:ro   # 쿼리 도구에서 파일 열기
    depends_on:
      db:
        condition: service_healthy

  # JupyterLab (4-1·4-2 공통 실습 화면). 저장소 루트 전체를 /work 로 연결해 강의 폴더를 모두 연다
  jupyter:
    build: ./jupyter
    image: ai4-lab/jupyter
    container_name: ai4-jupyter
    environment:
      LMSTUDIO_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}   # 임베딩 서버(LM Studio)
      DATABASE_URL: postgresql://lab:lab@db:5432/lab
      HF_HOME: /cache/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 용. Docker Desktop(Windows·macOS)은 없어도 된다
    ports:
      - "127.0.0.1:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - ..:/work            # 저장소 루트 (노트북에서 고친 내용이 호스트에 그대로 남는다)
      - hfcache:/cache      # 데이터셋 캐시: 컨테이너를 지워도 남아 다시 받지 않는다
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin:
  hfcache:
