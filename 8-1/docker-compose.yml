# 8-1 실습 환경: 에이전틱 AI — JupyterLab 하나. LLM 은 호스트의 LM Studio 서버(OpenAI 호환 API)를 쓴다
#
#   전제 : 도커 + LM Studio(서버 켬, 도구 호출이 되는 모델 로드). GPU 는 LM Studio 가 쓰므로 이 컨테이너는 GPU 가 필요 없다
#   전제 : 4-1 의 Jupyter 이미지(ai4-lab/jupyter)를 한 번 빌드했다 → cd ../4-1 && docker compose build
#
#   cd ./-ai-/8-1
#   docker compose up -d --build
#
#   실습 화면 : Jupyter  http://localhost:8894  → 8-1/notebooks
#
#   LM Studio 서버 포트가 1234 가 아니면 : LMSTUDIO_PORT=12345 docker compose up -d
#   쓸 모델 이름 지정(선택)               : AGENT_MODEL=qwen3.5-4b-mtp docker compose up -d
#   서버 없이 강사 실행 결과 재생          : AGENT_MODE=replay docker compose up -d   (notebooks/cache 의 응답을 그대로 쓴다)
#   생각을 먼저 쓰는 모델(답이 빈 채로 잘림) : AGENT_MIN_TOKENS=4096 docker compose up -d   (점검 : python tools/check_lmstudio.py)
#
# 포트는 127.0.0.1 에만 연다(로그인 없는 Jupyter 를 다른 기기가 열지 못하게)
name: ai4-lab

services:
  agent:
    build: ./lab
    image: ai4-lab/jupyter-agent
    container_name: ai4-agent
    ports:
      - "127.0.0.1:${AGENT_PORT:-8894}:8888"
    environment:
      - LMSTUDIO_URL=http://host.docker.internal:${LMSTUDIO_PORT:-1234}/v1
      - AGENT_MODEL=${AGENT_MODEL:-}
      - AGENT_MODE=${AGENT_MODE:-auto}
      - AGENT_MIN_TOKENS=${AGENT_MIN_TOKENS:-0}   # 생각을 먼저 쓰는 모델이면 4096 처럼 하한을 준다(느려짐)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 용. Docker Desktop(Windows·macOS)은 없어도 된다
    volumes:
      - ..:/work                               # 저장소 루트
